name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  host-tests:
    name: host unit tests (asan + ubsan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make python3

      - name: Run host tests
        run: make host-test

  kernel-build:
    name: kernel build (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [limine, multiboot2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make python3

      - name: Build kernel
        run: make kernel BOOT=${{ matrix.backend }}

  boot-tests:
    name: qemu boot test (${{ matrix.backend }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [limine, multiboot2]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain and emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm make python3 \
            qemu-system-x86 ovmf grub-efi-amd64-bin dosfstools mtools

      - name: Locate UEFI firmware
        id: firmware
        run: |
          for candidate in /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_CODE.fd \
                           /usr/share/ovmf/OVMF.fd; do
            if [ -f "$candidate" ]; then echo "code=$candidate" >> "$GITHUB_OUTPUT"; break; fi
          done
          for candidate in /usr/share/OVMF/OVMF_VARS_4M.fd /usr/share/OVMF/OVMF_VARS.fd; do
            if [ -f "$candidate" ]; then echo "vars=$candidate" >> "$GITHUB_OUTPUT"; break; fi
          done

      - name: Boot test
        run: |
          make boot-test \
            BOOT=${{ matrix.backend }} \
            GRUB_MKIMAGE=grub-mkimage \
            OVMF_CODE=${{ steps.firmware.outputs.code }} \
            OVMF_VARS_TEMPLATE=${{ steps.firmware.outputs.vars }}

      - name: Upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: serial-${{ matrix.backend }}
          path: build/${{ matrix.backend }}/boot-test.log

  static-analysis:
    name: clang-tidy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-tidy lld llvm make python3

      - name: Run clang-tidy
        run: make tidy
